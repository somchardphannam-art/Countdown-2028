<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown-2028</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0f14;
    color: #f5f7fa;
    font-family: "Segoe UI", Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    width: 100%;
    text-align: center;
    padding: 5vh 4vw;
  }
  .title {
    font-size: clamp(28px, 4vw, 64px);
    font-weight: 600;
    letter-spacing: .12em;
    margin-bottom: 2vh;
  }
  .target {
    font-size: clamp(18px, 2vw, 32px);
    opacity: .75;
    margin-bottom: 6vh;
  }
  .countdown {
    display: flex;
    justify-content: center;
    gap: clamp(10px, 2vw, 32px);
    flex-wrap: nowrap;
  }
  .unit {
    min-width: clamp(90px, 15vw, 250px);
  }
  .number {
    font-size: clamp(48px, 10vw, 170px);
    line-height: .95;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .label {
    margin-top: 1.5vh;
    font-size: clamp(14px, 1.5vw, 26px);
    letter-spacing: .16em;
    opacity: .65;
  }
  .message {
    display: none;
    font-size: clamp(40px, 8vw, 120px);
    font-weight: 700;
  }
  .hint {
    position: fixed;
    bottom: 18px;
    width: 100%;
    text-align: center;
    font-size: 13px;
    opacity: .35;
  }
  @media (max-width: 700px) {
    .countdown { gap: 8px; }
    .unit { min-width: 70px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="title">COUNTDOWN TO 2028</div>
  <div class="target">1 JANUARY 2028 • 00:00:00</div>

  <div class="countdown" id="countdown">
    <div class="unit"><div class="number" id="days">000</div><div class="label">DAYS</div></div>
    <div class="unit"><div class="number" id="hours">00</div><div class="label">HOURS</div></div>
    <div class="unit"><div class="number" id="minutes">00</div><div class="label">MINUTES</div></div>
    <div class="unit"><div class="number" id="seconds">00</div><div class="label">SECONDS</div></div>
  </div>

  <div class="message" id="message">HAPPY NEW YEAR 2028!</div>
</div>

<div class="hint">Press F11 for full-screen • The countdown uses your PC's local time</div>

<script>
const target = new Date("2028-01-01T00:00:00");

function updateCountdown() {
  const now = new Date();
  let diff = target - now;

  if (diff <= 0) {
    document.getElementById("countdown").style.display = "none";
    document.getElementById("message").style.display = "block";
    return;
  }

  const totalSeconds = Math.floor(diff / 1000);
  const days = Math.floor(totalSeconds / 86400);
  const hours = Math.floor((totalSeconds % 86400) / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  document.getElementById("days").textContent = String(days).padStart(3, "0");
  document.getElementById("hours").textContent = String(hours).padStart(2, "0");
  document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
  document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
}

updateCountdown();
setInterval(updateCountdown, 250);
</script>
</body>
</html>
